# Temporary public test environment. Keep this overlay separate from
# compose.production.yml: production keeps its encrypted off-site backups,
# payment configuration, and long-lived HSTS policy.
services:
  api:
    environment:
      DEPLOYMENT_ENV: staging
      BACKUP_ENABLED: "false"
      YOOKASSA_SHOP_ID: ""
      YOOKASSA_SECRET_KEY: ""
      SENTRY_ENVIRONMENT: staging

  worker:
    environment:
      DEPLOYMENT_ENV: staging
      BACKUP_ENABLED: "false"
      SENTRY_ENVIRONMENT: staging
      ALLOW_PRESENTATION_WITHOUT_SOURCE_SNAPSHOT: ${ALLOW_PRESENTATION_WITHOUT_SOURCE_SNAPSHOT:-false}
      DATABASE_URL: ${DATABASE_URL}
      AI_PROVIDER: ${AI_PROVIDER}

  web:
    environment:
      DEPLOYMENT_ENV: staging
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: staging

  caddy:
    environment:
      # Do not teach browsers to pin the test deployment as a production host.
      HSTS_MAX_AGE: "0"

# Do not declare driver options for the default network here. The staging
# project already owns an active bridge, and Compose must reuse it instead of
# trying to update or replace the network during an application rollout.
