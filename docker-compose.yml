services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studydeck
      POSTGRES_USER: studydeck
      POSTGRES_PASSWORD: studydeck
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studydeck -d studydeck"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studydeck
      MINIO_ROOT_PASSWORD: studydeck-password
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 studydeck studydeck-password;
      mc mb -p local/studydeck || true;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      API_PORT: 4000
      ALLOW_DEV_ADMIN: ${ALLOW_DEV_ADMIN:-true}
      DEPLOYMENT_ENV: local
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://studydeck:studydeck@postgres:5432/studydeck?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/v1/health/ready\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      DEPLOYMENT_ENV: local
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://studydeck:studydeck@postgres:5432/studydeck?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node apps/worker/src/healthcheck.cjs"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      INTERNAL_API_URL: http://api:4000
      DATABASE_URL: postgresql://studydeck:studydeck@postgres:5432/studydeck?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3010}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-local-auth-secret}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-false}
      ALLOW_DEV_ADMIN: ${ALLOW_DEV_ADMIN:-true}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      DEPLOYMENT_ENV: local
      TEMP_USER_ID: ${TEMP_USER_ID:-local-user}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
