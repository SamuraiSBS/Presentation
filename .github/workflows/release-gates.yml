name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality, migrations, and dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
        env:
          # Validation parses the Prisma schema but does not connect to this
          # database. CI still needs a syntactically valid URL because the
          # schema references DATABASE_URL.
          DATABASE_URL: postgresql://studydeck:studydeck@localhost:5432/studydeck?schema=public
      - run: npm run lint
      - run: npm run check
      - run: npm run build -w @studydeck/web
      - run: npm run bundle:check
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate staging deployment contract
        run: |
          bash -n scripts/deploy-staging-release.sh
          STUDYDECK_API_IMAGE=ghcr.io/example/studydeck-api@sha256:$(printf '%064d' 1) \
          STUDYDECK_WORKER_IMAGE=ghcr.io/example/studydeck-worker@sha256:$(printf '%064d' 2) \
          STUDYDECK_WEB_IMAGE=ghcr.io/example/studydeck-web@sha256:$(printf '%064d' 3) \
          DATABASE_URL=postgresql://studydeck:studydeck@postgres:5432/studydeck?schema=public \
          AI_PROVIDER=openai \
          PRODUCTION_ENV_FILE=.env.example \
            docker compose --project-name studydeck-staging \
              -f compose.production.yml -f compose.release.yml -f compose.staging.yml config --quiet

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  browser:
    name: Playwright desktop and mobile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  immutable-image-smoke:
    name: Immutable images and staging smoke
    needs: [quality, secrets, browser]
    runs-on: ubuntu-24.04
    outputs:
      image_namespace: ${{ steps.registry.outputs.image_namespace }}
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Keep the required PR check while deferring release-only work
        if: github.event_name == 'pull_request'
        run: echo "PR quality, secret, and browser gates passed; immutable release build runs after merge."
      - name: Refuse unclassified Prisma migration changes
        if: github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          if [ "$before" = '0000000000000000000000000000000000000000' ]; then
            echo "First push has no safe migration comparison base; publish a release from a reviewed follow-up commit."
            exit 1
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" -- prisma/migrations | grep -q .; then
            echo "Prisma migration changes require an explicit forward-fix/rollback compatibility policy before publication."
            exit 1
          fi
      - id: registry
        name: Normalize the GHCR namespace
        if: github.event_name == 'push'
        run: echo "image_namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push'
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        name: Build and publish the API release image once
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.registry.outputs.image_namespace }}/studydeck-api:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=studydeck-api
          cache-to: type=gha,mode=max,scope=studydeck-api
      - id: worker
        name: Build and publish the worker release image once
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.registry.outputs.image_namespace }}/studydeck-worker:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=studydeck-worker
          cache-to: type=gha,mode=max,scope=studydeck-worker
      - id: web
        name: Build and publish the web release image once
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.registry.outputs.image_namespace }}/studydeck-web:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=studydeck-web
          cache-to: type=gha,mode=max,scope=studydeck-web

  publish-release:
    name: Publish immutable release and verify registry digests
    if: github.event_name == 'push'
    needs: [quality, secrets, browser, immutable-image-smoke]
    runs-on: ubuntu-24.04
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ needs.immutable-image-smoke.outputs.image_namespace }}
      STUDYDECK_API_IMAGE: ghcr.io/${{ needs.immutable-image-smoke.outputs.image_namespace }}/studydeck-api@${{ needs.immutable-image-smoke.outputs.api_digest }}
      STUDYDECK_WORKER_IMAGE: ghcr.io/${{ needs.immutable-image-smoke.outputs.image_namespace }}/studydeck-worker@${{ needs.immutable-image-smoke.outputs.worker_digest }}
      STUDYDECK_WEB_IMAGE: ghcr.io/${{ needs.immutable-image-smoke.outputs.image_namespace }}/studydeck-web@${{ needs.immutable-image-smoke.outputs.web_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # This job runs on a new runner. Its package install is needed solely for
      # the release-only Lighthouse assertion against the published web image.
      - run: npm ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release image digests are present
        run: |
          test -n "${{ needs.immutable-image-smoke.outputs.api_digest }}"
          test -n "${{ needs.immutable-image-smoke.outputs.worker_digest }}"
          test -n "${{ needs.immutable-image-smoke.outputs.web_digest }}"
      - name: Scan API release image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.STUDYDECK_API_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan worker release image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.STUDYDECK_WORKER_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan web release image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.STUDYDECK_WEB_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Render a real PDF in the published Alpine worker image
        run: >
          docker run --rm --entrypoint node "$STUDYDECK_WORKER_IMAGE"
          apps/worker/dist/tasks/export-runtime-smoke.js --case real-pdf
      - name: Smoke golden export in the published Alpine worker image
        run: >
          docker run --rm --entrypoint node "$STUDYDECK_WORKER_IMAGE"
          apps/worker/dist/tasks/export-runtime-smoke.js --case golden
      - name: Pull and validate the exact registry images
        run: |
          docker pull "$STUDYDECK_API_IMAGE"
          docker pull "$STUDYDECK_WORKER_IMAGE"
          docker pull "$STUDYDECK_WEB_IMAGE"
          docker compose -f docker-compose.yml -f compose.release.yml config --quiet
          docker compose -f docker-compose.yml -f compose.release.yml up -d --no-build postgres redis minio create-bucket
          docker compose -f docker-compose.yml -f compose.release.yml run --rm --no-deps --entrypoint node api node_modules/prisma/build/index.js migrate deploy
          docker compose -f docker-compose.yml -f compose.release.yml up -d --no-build api worker web
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:4000/v1/health/ready; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f docker-compose.yml -f compose.release.yml logs --no-color
            exit 1
          fi
          for service in api worker web; do
            healthy=false
            for attempt in $(seq 1 30); do
              container_id="$(docker compose -f docker-compose.yml -f compose.release.yml ps -q "$service")"
              if [ -n "$container_id" ] && [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              echo "Service $service did not become healthy before evidence capture."
              docker compose -f docker-compose.yml -f compose.release.yml logs --no-color
              exit 1
            fi
          done
      - name: Write deployable release manifest
        run: |
          printf '{\n  "gitSha": "%s",\n  "releaseGate": "passed",\n  "migrationCompatibility": "no-schema-change",\n  "images": {\n' "$GITHUB_SHA" > release-manifest.json
          printf '    "api": "%s",\n' "$STUDYDECK_API_IMAGE" >> release-manifest.json
          printf '    "worker": "%s",\n' "$STUDYDECK_WORKER_IMAGE" >> release-manifest.json
          printf '    "web": "%s"\n' "$STUDYDECK_WEB_IMAGE" >> release-manifest.json
          printf '  }\n}\n' >> release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
      - name: Collect registry-smoke logs
        if: always()
        run: docker compose -f docker-compose.yml -f compose.release.yml logs --no-color
      - name: Capture registry readiness evidence
        if: always()
        run: |
          {
            echo "== docker compose ps =="
            docker compose -f docker-compose.yml -f compose.release.yml ps
            echo "== /v1/health/live =="
            curl --silent --show-error http://localhost:4000/v1/health/live || true
            echo
            echo "== /v1/health/ready =="
            curl --silent --show-error http://localhost:4000/v1/health/ready || true
            echo
            echo "== /v1/health/workers =="
            curl --silent --show-error http://localhost:4000/v1/health/workers || true
            echo
          } | tee registry-health-evidence.txt
      - name: Upload registry readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-health-evidence-${{ github.sha }}
          path: registry-health-evidence.txt
          if-no-files-found: error
