name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality, migrations, and dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
        env:
          # Validation parses the Prisma schema but does not connect to this
          # database. CI still needs a syntactically valid URL because the
          # schema references DATABASE_URL.
          DATABASE_URL: postgresql://studydeck:studydeck@localhost:5432/studydeck?schema=public
      - run: npm run lint
      - run: npm run check
      - run: npm run build -w @studydeck/web
      - run: npm run bundle:check
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm test
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  browser:
    name: Playwright desktop and mobile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  immutable-image-smoke:
    name: Immutable images and staging smoke
    needs: [quality, secrets, browser]
    runs-on: ubuntu-24.04
    env:
      STUDYDECK_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release images
        run: |
          docker build --tag studydeck-api:${STUDYDECK_IMAGE_TAG} --file Dockerfile.api .
          docker build --tag studydeck-worker:${STUDYDECK_IMAGE_TAG} --file Dockerfile.worker .
          docker build --tag studydeck-web:${STUDYDECK_IMAGE_TAG} --file Dockerfile.web .
      - name: Scan API release image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studydeck-api:${{ env.STUDYDECK_IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan worker release image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studydeck-worker:${{ env.STUDYDECK_IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan web release image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studydeck-web:${{ env.STUDYDECK_IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Render a real PDF in the Alpine worker image
        run: >
          docker run --rm --entrypoint node studydeck-worker:${STUDYDECK_IMAGE_TAG}
          apps/worker/dist/tasks/export-runtime-smoke.js --case real-pdf
      - name: Smoke golden export in the Alpine worker image
        run: >
          docker run --rm --entrypoint node studydeck-worker:${STUDYDECK_IMAGE_TAG}
          apps/worker/dist/tasks/export-runtime-smoke.js --case golden
      - name: Validate compose and migrate the staging database
        run: |
          docker compose -f docker-compose.yml -f compose.ci.yml config --quiet
          docker compose -f docker-compose.yml -f compose.ci.yml up -d --no-build postgres redis minio create-bucket
          docker compose -f docker-compose.yml -f compose.ci.yml run --rm --no-deps --entrypoint node api node_modules/prisma/build/index.js migrate deploy
      - name: Start and smoke the exact release images
        run: |
          docker compose -f docker-compose.yml -f compose.ci.yml up -d --no-build api worker web
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:4000/v1/health/ready; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f docker-compose.yml -f compose.ci.yml logs --no-color
            exit 1
          fi
          for service in api worker web; do
            healthy=false
            for attempt in $(seq 1 30); do
              container_id="$(docker compose -f docker-compose.yml -f compose.ci.yml ps -q "$service")"
              if [ -n "$container_id" ] && [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              echo "Service $service did not become healthy before evidence capture."
              docker compose -f docker-compose.yml -f compose.ci.yml logs --no-color
              exit 1
            fi
          done
      - name: Enforce Lighthouse and Core Web Vitals on the exact web image
        run: |
          npx playwright install --with-deps chromium
          npm run lighthouse:production -- --url=http://localhost:3000/ --output=lighthouse-production.json --assert
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production-${{ github.sha }}
          path: lighthouse-production.json
          if-no-files-found: ignore
      - name: Collect staging logs
        if: always()
        run: docker compose -f docker-compose.yml -f compose.ci.yml logs --no-color
      - name: Capture staging readiness evidence
        if: always()
        run: |
          {
            echo "== docker compose ps =="
            docker compose -f docker-compose.yml -f compose.ci.yml ps
            echo "== /v1/health/live =="
            curl --silent --show-error http://localhost:4000/v1/health/live || true
            echo
            echo "== /v1/health/ready =="
            curl --silent --show-error http://localhost:4000/v1/health/ready || true
            echo
            echo "== /v1/health/workers =="
            curl --silent --show-error http://localhost:4000/v1/health/workers || true
            echo
          } | tee staging-health-evidence.txt
      - name: Upload staging readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-health-evidence-${{ github.sha }}
          path: staging-health-evidence.txt
          if-no-files-found: error

  publish-release:
    name: Publish immutable release and verify registry digests
    if: github.event_name == 'push'
    needs: [quality, secrets, browser, immutable-image-smoke]
    runs-on: ubuntu-24.04
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse unclassified Prisma migration changes
        run: |
          before='${{ github.event.before }}'
          if [ "$before" = '0000000000000000000000000000000000000000' ]; then
            echo "First push has no safe migration comparison base; publish a release from a reviewed follow-up commit."
            exit 1
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" -- prisma/migrations | grep -q .; then
            echo "Prisma migration changes require an explicit forward-fix/rollback compatibility policy before publication."
            exit 1
          fi
      - name: Normalize the GHCR namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/studydeck-api:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/studydeck-worker:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/studydeck-web:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Pin image references to the published digests
        run: |
          echo "STUDYDECK_API_IMAGE=${REGISTRY}/${IMAGE_NAMESPACE}/studydeck-api@${{ steps.api.outputs.digest }}" >> "$GITHUB_ENV"
          echo "STUDYDECK_WORKER_IMAGE=${REGISTRY}/${IMAGE_NAMESPACE}/studydeck-worker@${{ steps.worker.outputs.digest }}" >> "$GITHUB_ENV"
          echo "STUDYDECK_WEB_IMAGE=${REGISTRY}/${IMAGE_NAMESPACE}/studydeck-web@${{ steps.web.outputs.digest }}" >> "$GITHUB_ENV"
      - name: Pull and validate the exact registry images
        run: |
          docker pull "$STUDYDECK_API_IMAGE"
          docker pull "$STUDYDECK_WORKER_IMAGE"
          docker pull "$STUDYDECK_WEB_IMAGE"
          docker compose -f docker-compose.yml -f compose.release.yml config --quiet
          docker compose -f docker-compose.yml -f compose.release.yml up -d --no-build postgres redis minio create-bucket
          docker compose -f docker-compose.yml -f compose.release.yml run --rm --no-deps --entrypoint node api node_modules/prisma/build/index.js migrate deploy
          docker compose -f docker-compose.yml -f compose.release.yml up -d --no-build api worker web
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:4000/v1/health/ready; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f docker-compose.yml -f compose.release.yml logs --no-color
            exit 1
          fi
          for service in api worker web; do
            healthy=false
            for attempt in $(seq 1 30); do
              container_id="$(docker compose -f docker-compose.yml -f compose.release.yml ps -q "$service")"
              if [ -n "$container_id" ] && [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              echo "Service $service did not become healthy before evidence capture."
              docker compose -f docker-compose.yml -f compose.release.yml logs --no-color
              exit 1
            fi
          done
      - name: Write deployable release manifest
        run: |
          printf '{\n  "gitSha": "%s",\n  "releaseGate": "passed",\n  "migrationCompatibility": "no-schema-change",\n  "images": {\n' "$GITHUB_SHA" > release-manifest.json
          printf '    "api": "%s",\n' "$STUDYDECK_API_IMAGE" >> release-manifest.json
          printf '    "worker": "%s",\n' "$STUDYDECK_WORKER_IMAGE" >> release-manifest.json
          printf '    "web": "%s"\n' "$STUDYDECK_WEB_IMAGE" >> release-manifest.json
          printf '  }\n}\n' >> release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
      - name: Collect registry-smoke logs
        if: always()
        run: docker compose -f docker-compose.yml -f compose.release.yml logs --no-color
      - name: Capture registry readiness evidence
        if: always()
        run: |
          {
            echo "== docker compose ps =="
            docker compose -f docker-compose.yml -f compose.release.yml ps
            echo "== /v1/health/live =="
            curl --silent --show-error http://localhost:4000/v1/health/live || true
            echo
            echo "== /v1/health/ready =="
            curl --silent --show-error http://localhost:4000/v1/health/ready || true
            echo
            echo "== /v1/health/workers =="
            curl --silent --show-error http://localhost:4000/v1/health/workers || true
            echo
          } | tee registry-health-evidence.txt
      - name: Upload registry readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-health-evidence-${{ github.sha }}
          path: registry-health-evidence.txt
          if-no-files-found: error
