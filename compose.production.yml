# Public deployment only. Do not combine this file with docker-compose.yml:
# that file intentionally keeps local ports and development conveniences.
#
# Start with:
#   docker compose --env-file .env.production -f compose.production.yml up -d --build
services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc@sha256:b55b1283c0b81b8bb473c94133d4e00a552518c4796a954ddb04bb7b6e05927d
    restart: "no"
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    environment:
      MC_CONFIG_DIR: /tmp/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        do sleep 2; done;
        mc mb -p "local/$$S3_BUCKET" || true

  clamav:
    # Official ClamAV 1.5 image, pinned from the reviewed manifest digest.
    # Signature updates persist in the named volume; this service is private.
    image: clamav/clamav@sha256:8117550b0e762eeabe5376c9f6f9c6adbf1a2da50c1bc70c08ae600930817523
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.00

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/v1/health/ready\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    stop_grace_period: 15m
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.00
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      PUPPETEER_CACHE_DIR: /tmp/puppeteer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node apps/worker/src/healthcheck.cjs"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      INTERNAL_API_URL: http://api:4000
      ALLOW_DEV_AUTH: "false"
      ALLOW_DEV_ADMIN: "false"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy-init:
    # Caddy itself runs as the unprivileged caddy user. This tiny one-shot
    # initializer only fixes ownership of pre-existing named volumes.
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec", "chown -R 1000:1000 /data /config"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    user: "1000:1000"
    environment:
      HOME: /data
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      caddy-init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  clamav-data:
  caddy-data:
  caddy-config:

networks:
  # Telegram OIDC is reachable from the VPS over IPv6. Keep the application
  # bridge on an IPv6-enabled network so Auth.js can reach the provider from
  # the web container as well as from the host.
  default:
    enable_ipv6: true
