# Public deployment only. Do not combine this file with docker-compose.yml:
# that file intentionally keeps local ports and development conveniences.
#
# Start with:
#   docker compose --env-file .env.production -f compose.production.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    restart: "no"
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        do sleep 2; done;
        mc mb -p "local/$$S3_BUCKET" || true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/v1/health/ready\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    stop_grace_period: 15m
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node apps/worker/src/healthcheck.cjs"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      INTERNAL_API_URL: http://api:4000
      ALLOW_DEV_AUTH: "false"
      ALLOW_DEV_ADMIN: "false"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
