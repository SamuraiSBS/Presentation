<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="934" viewBox="0 0 1610 934">
  <title>Lazyum editable neon banner</title>
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#111122"/>
      <stop offset="58%" stop-color="#050711"/>
      <stop offset="100%" stop-color="#02040b"/>
    </radialGradient>
    <linearGradient id="logoVertical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ef7aa"/>
      <stop offset="45%" stop-color="#b7df23"/>
      <stop offset="72%" stop-color="#ff9b1b"/>
      <stop offset="100%" stop-color="#f4246d"/>
    </linearGradient>
    <linearGradient id="logoBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a19"/>
      <stop offset="43%" stop-color="#fa24d8"/>
      <stop offset="100%" stop-color="#472bff"/>
    </linearGradient>
    <linearGradient id="greenArc" x1="0%" y1="15%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a1c"/>
      <stop offset="56%" stop-color="#063329"/>
      <stop offset="100%" stop-color="#20ff93"/>
    </linearGradient>
    <linearGradient id="purpleArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c17ff"/>
      <stop offset="50%" stop-color="#8b23ff"/>
      <stop offset="100%" stop-color="#ff3fad"/>
    </linearGradient>
    <linearGradient id="orangeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd448"/>
      <stop offset="100%" stop-color="#ff6816"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="cyanGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonGreen" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#14f58b" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#14f58b" flood-opacity="0.42"/>
    </filter>
    <filter id="neonPurple" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a852ff" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#7d30ff" flood-opacity="0.5"/>
    </filter>
    <filter id="neonOrange" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff9b1a" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ff7a18" flood-opacity="0.45"/>
    </filter>
    <filter id="magentaGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff2fd0" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#9d37ff" flood-opacity="0.5"/>
    </filter>
    <style>
      .title { font-family: Nunito, "Nunito Variable", sans-serif; font-size: 116px; font-weight: 800; letter-spacing: 0; }
      .tagline { font-family: Nunito, "Nunito Variable", sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 0; }
      .feature { font-family: Nunito, "Nunito Variable", sans-serif; font-size: 29px; font-weight: 650; letter-spacing: 0; }
      .thin { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dot { opacity: 0.95; }
    </style>
  </defs>

  <g id="page">
    <rect id="page-background" width="1610" height="934" fill="#f7f7f6"/>
  </g>

  <g id="banner-card" filter="url(#softShadow)">
    <rect id="rounded-dark-banner" x="58" y="45" width="1505" height="840" rx="52" fill="url(#bannerBg)"/>
  </g>

  <clipPath id="bannerClip">
    <rect x="58" y="45" width="1505" height="840" rx="52"/>
  </clipPath>

  <g id="editable-banner-content" clip-path="url(#bannerClip)">
    <g id="background-glows">
      <circle id="green-haze-left" cx="196" cy="85" r="318" fill="#071f20" opacity="0.52"/>
      <circle id="violet-haze-right" cx="1390" cy="700" r="350" fill="#160a42" opacity="0.56"/>
      <circle id="blue-haze-center" cx="900" cy="520" r="280" fill="#061025" opacity="0.42"/>
    </g>

    <g id="large-planet-arcs">
      <circle id="top-left-green-planet" cx="-34" cy="-36" r="535" fill="none" stroke="url(#greenArc)" stroke-width="110" opacity="0.85" filter="url(#neonGreen)"/>
      <circle id="top-left-inner-ring-1" cx="-34" cy="-36" r="395" fill="none" stroke="#13c477" stroke-width="2" opacity="0.22"/>
      <circle id="top-left-inner-ring-2" cx="-34" cy="-36" r="292" fill="none" stroke="#2ee7a3" stroke-width="1.4" opacity="0.18"/>
      <circle id="top-left-dashed-ring" cx="-34" cy="-36" r="366" fill="none" stroke="#22d98b" stroke-width="2" stroke-dasharray="8 12" opacity="0.25"/>

      <circle id="top-right-purple-planet" cx="1468" cy="57" r="245" fill="none" stroke="url(#purpleArc)" stroke-width="28" opacity="0.9" filter="url(#magentaGlow)"/>
      <circle id="top-right-orange-ring-1" cx="1468" cy="57" r="92" fill="none" stroke="#ff9219" stroke-width="2" opacity="0.72"/>
      <circle id="top-right-orange-ring-2" cx="1468" cy="57" r="133" fill="none" stroke="#ff9219" stroke-width="2" opacity="0.42"/>
      <circle id="top-right-orange-ring-3" cx="1468" cy="57" r="170" fill="none" stroke="#ff9219" stroke-width="2" opacity="0.28"/>
      <circle id="top-right-orange-ring-4" cx="1468" cy="57" r="205" fill="none" stroke="#ff9219" stroke-width="2" opacity="0.18"/>

      <circle id="bottom-right-violet-arc" cx="1600" cy="935" r="448" fill="none" stroke="url(#purpleArc)" stroke-width="30" opacity="0.95" filter="url(#neonPurple)"/>
      <circle id="bottom-right-planet-fill" cx="1505" cy="749" r="112" fill="#250d30" stroke="#cd36a6" stroke-width="2" opacity="0.78"/>
    </g>

    <g id="bottom-clouds-and-leaves">
      <path id="left-purple-clouds" d="M58 830 C78 758 125 749 154 783 C178 747 222 768 232 826 L232 885 L58 885 Z" fill="#230246" opacity="0.9" filter="url(#neonPurple)"/>
      <path id="left-green-leaves" d="M108 752 C103 704 131 660 158 655 C157 704 135 737 108 752 Z M86 777 C69 734 76 696 98 684 C112 724 111 755 86 777 Z M129 717 C141 673 168 644 192 639 C191 686 166 712 129 717 Z" fill="#0f935a" opacity="0.74" filter="url(#neonGreen)"/>
      <path id="right-green-clouds" d="M1300 885 C1309 823 1362 818 1384 846 C1418 775 1502 776 1521 843 C1544 828 1565 842 1584 872 L1584 885 Z" fill="#073f32" opacity="0.88" filter="url(#neonGreen)"/>
      <path id="right-purple-cloud" d="M1220 885 C1237 836 1278 823 1310 852 C1347 808 1394 824 1413 885 Z" fill="#260736" opacity="0.78" filter="url(#magentaGlow)"/>
    </g>

    <g id="decorative-spirals-and-lines">
      <path id="left-main-purple-spiral" class="thin" d="M405 352 C399 270 473 215 540 229 C607 244 599 335 538 338 C499 340 484 297 511 279 C537 261 564 292 543 315" stroke="#8234ff" stroke-width="3" filter="url(#neonPurple)"/>
      <path id="left-bottom-purple-spiral" class="thin" d="M210 552 C220 493 300 490 311 535 C320 574 270 594 255 560 C246 538 272 518 290 537" stroke="#7f34ff" stroke-width="3" filter="url(#neonPurple)"/>
      <path id="lower-magenta-spiral" class="thin" d="M394 622 C386 564 453 535 478 572 C502 606 454 645 435 611 C423 590 448 570 462 591" stroke="#d52bff" stroke-width="3" filter="url(#magentaGlow)"/>
      <path id="upper-small-green-spiral" class="thin" d="M944 208 C982 138 1070 152 1061 226 C1053 288 965 276 984 223 C995 191 1035 202 1026 232 C1018 255 990 245 998 224" stroke="#55e49f" stroke-width="3" opacity="0.82" filter="url(#neonGreen)"/>
      <path id="bottom-orange-spiral" class="thin" d="M1211 650 C1199 596 1266 570 1291 604 C1314 636 1275 678 1251 648 C1235 629 1262 606 1277 626" stroke="#ff9a1b" stroke-width="3" filter="url(#neonOrange)"/>
      <path id="right-green-wave" class="thin" d="M1230 346 C1272 325 1282 342 1282 373 C1282 401 1326 395 1342 386 C1375 366 1398 386 1388 430 C1380 468 1435 450 1430 492" stroke="#12d878" stroke-width="4" filter="url(#neonGreen)"/>
      <path id="center-dotted-route" class="thin" d="M615 598 C751 664 916 680 1027 612 C1130 542 1127 441 1090 427" stroke="#1fd48b" stroke-width="2" stroke-dasharray="3 10" opacity="0.32"/>
      <path id="bottom-dotted-route" class="thin" d="M566 830 C690 793 790 835 907 826 C1002 819 1099 788 1222 829" stroke="#ff8716" stroke-width="2" stroke-dasharray="5 12" opacity="0.55"/>
      <path id="left-dotted-loop" class="thin" d="M182 442 C282 404 340 459 324 544" stroke="#1ad47f" stroke-width="2" stroke-dasharray="5 10" opacity="0.55"/>
    </g>

    <g id="small-neon-symbols">
      <path id="orange-cross" d="M1231 241 L1249 259 M1249 241 L1231 259" stroke="#ff9a18" stroke-width="5" stroke-linecap="round" filter="url(#neonOrange)"/>
      <path id="purple-star" d="M1328 476 L1342 496 L1360 508 L1340 521 L1327 540 L1313 520 L1294 507 L1315 494 Z" fill="none" stroke="#9f4dff" stroke-width="2.4" filter="url(#neonPurple)"/>
      <g id="purple-dot-grid" fill="#b448ff" filter="url(#neonPurple)">
        <circle cx="1122" cy="73" r="3"/><circle cx="1139" cy="73" r="3"/><circle cx="1156" cy="73" r="3"/><circle cx="1173" cy="73" r="3"/><circle cx="1190" cy="73" r="3"/>
        <circle cx="1122" cy="90" r="3"/><circle cx="1139" cy="90" r="3"/><circle cx="1156" cy="90" r="3"/><circle cx="1173" cy="90" r="3"/><circle cx="1190" cy="90" r="3"/>
        <circle cx="1122" cy="107" r="3"/><circle cx="1139" cy="107" r="3"/><circle cx="1156" cy="107" r="3"/><circle cx="1173" cy="107" r="3"/><circle cx="1190" cy="107" r="3"/>
        <circle cx="1122" cy="124" r="3"/><circle cx="1139" cy="124" r="3"/><circle cx="1156" cy="124" r="3"/><circle cx="1173" cy="124" r="3"/><circle cx="1190" cy="124" r="3"/>
      </g>
    </g>

    <g id="floating-dots">
      <circle id="dot-orange-top-left" class="dot" cx="160" cy="137" r="16" fill="#11131a" stroke="#ff6c19" stroke-width="2.2" filter="url(#neonOrange)"/>
      <circle id="dot-purple-top" class="dot" cx="560" cy="134" r="14" fill="#13023d" stroke="#6f35ff" stroke-width="2.2" filter="url(#neonPurple)"/>
      <circle id="dot-orange-top-right" class="dot" cx="1464" cy="114" r="11" fill="#ff9a19" filter="url(#neonOrange)"/>
      <circle id="dot-green-mid" class="dot" cx="1042" cy="311" r="6" fill="#0ec679" filter="url(#neonGreen)"/>
      <circle id="dot-yellow-mid" class="dot" cx="1156" cy="316" r="7" fill="#ffbf19" filter="url(#neonOrange)"/>
      <circle id="dot-yellow-left" class="dot" cx="617" cy="356" r="5" fill="#ffe11c" filter="url(#neonOrange)"/>
      <circle id="dot-purple-right" class="dot" cx="1082" cy="588" r="11" fill="#16013d" stroke="#7632ff" stroke-width="2.4" filter="url(#neonPurple)"/>
      <circle id="dot-orange-lower" class="dot" cx="811" cy="654" r="6" fill="none" stroke="#ff9719" stroke-width="3" filter="url(#neonOrange)"/>
      <circle id="dot-red-bottom" class="dot" cx="835" cy="854" r="10" fill="none" stroke="#ff4337" stroke-width="2.4" filter="url(#neonOrange)"/>
      <circle id="dot-green-bottom-left" class="dot" cx="461" cy="832" r="6" fill="#0ba76b" filter="url(#neonGreen)"/>
      <circle id="dot-purple-bottom-left" class="dot" cx="335" cy="852" r="10" fill="#6520d8" filter="url(#neonPurple)"/>
      <circle id="dot-orange-right" class="dot" cx="1489" cy="713" r="8" fill="#ff7d13" filter="url(#neonOrange)"/>
      <circle id="dot-white-1" class="dot" cx="353" cy="237" r="2" fill="#ffffff" opacity="0.75"/>
      <circle id="dot-white-2" class="dot" cx="923" cy="58" r="2" fill="#ffffff" opacity="0.55"/>
      <circle id="dot-white-3" class="dot" cx="1129" cy="389" r="2" fill="#ffffff" opacity="0.55"/>
      <circle id="dot-green-small-left" class="dot" cx="176" cy="250" r="4" fill="#16e685" filter="url(#neonGreen)"/>
      <circle id="dot-orange-small-left" class="dot" cx="122" cy="273" r="5" fill="#ff8718" filter="url(#neonOrange)"/>
      <circle id="dot-orange-small-left-2" class="dot" cx="206" cy="600" r="7" fill="#ffb237" filter="url(#neonOrange)"/>
    </g>

    <g id="lazyum-logo" filter="url(#cyanGlow)">
      <rect id="logo-vertical-pill" x="711" y="132" width="88" height="250" rx="44" fill="url(#logoVertical)"/>
      <rect id="logo-horizontal-base" x="711" y="313" width="220" height="78" rx="39" fill="url(#logoBase)"/>
      <path id="logo-inner-highlight" d="M798 261 C772 294 744 310 712 326 L712 234 C742 252 772 262 798 261 Z" fill="#ffd21c" opacity="0.58"/>
    </g>

    <g id="central-text">
      <text id="lazyum-title" class="title" x="805" y="522" text-anchor="middle" fill="#ffffff">Lazyum</text>
      <g id="tagline-words">
        <text id="tagline-study" class="tagline" x="574" y="605" fill="#12c86e">Учёба.</text>
        <text id="tagline-projects" class="tagline" x="717" y="605" fill="#ff7c17">Проекты.</text>
        <text id="tagline-success" class="tagline" x="907" y="605" fill="#9a35ff">Успех.</text>
      </g>
    </g>

    <g id="feature-row">
      <line id="separator-left" x1="568" y1="686" x2="568" y2="796" stroke="#ffffff" stroke-width="2" opacity="0.18"/>
      <line id="separator-right" x1="1031" y1="686" x2="1031" y2="796" stroke="#ffffff" stroke-width="2" opacity="0.18"/>

      <g id="feature-presentations">
        <rect id="presentation-icon-box" x="207" y="676" width="132" height="126" rx="24" fill="#10071f" stroke="#8037ff" stroke-width="2" opacity="0.9" filter="url(#neonPurple)"/>
        <g id="presentation-board-icon" stroke="#b966ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonPurple)">
          <rect x="236" y="705" width="74" height="54" rx="4"/>
          <line x1="233" y1="704" x2="313" y2="704"/>
          <line x1="273" y1="759" x2="273" y2="779"/>
          <line x1="252" y1="779" x2="294" y2="779"/>
          <circle cx="260" cy="733" r="12"/>
          <line x1="260" y1="721" x2="260" y2="745"/>
          <line x1="260" y1="733" x2="296" y2="733"/>
        </g>
        <text id="presentation-label" class="feature" x="365" y="734" fill="#ffffff">
          <tspan x="365" dy="0">Генерация</tspan>
          <tspan x="365" dy="40">Презентаций</tspan>
        </text>
      </g>

      <g id="feature-projects">
        <rect id="project-icon-box" x="600" y="676" width="132" height="126" rx="24" fill="#1b0f08" stroke="#ff9118" stroke-width="2" opacity="0.9" filter="url(#neonOrange)"/>
        <g id="document-pencil-icon" stroke="#ffae30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonOrange)">
          <path d="M642 704 H675 L691 720 V772 H642 Z"/>
          <path d="M675 704 V721 H691"/>
          <line x1="654" y1="728" x2="671" y2="728"/>
          <line x1="654" y1="747" x2="678" y2="747"/>
          <path d="M681 765 L710 736 C717 729 728 740 721 747 L692 776 L674 782 Z"/>
        </g>
        <text id="project-label" class="feature" x="752" y="734" fill="#ffffff">
          <tspan x="752" dy="0">Купить проект/</tspan>
          <tspan x="752" dy="40">курсовую/реферат</tspan>
        </text>
      </g>

      <g id="feature-session-bot">
        <rect id="bot-icon-box" x="1059" y="676" width="132" height="126" rx="24" fill="#051910" stroke="#16df7c" stroke-width="2" opacity="0.9" filter="url(#neonGreen)"/>
        <g id="robot-icon" stroke="#40f59c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGreen)">
          <rect x="1095" y="722" width="60" height="48" rx="14"/>
          <line x1="1125" y1="722" x2="1125" y2="704"/>
          <circle cx="1125" cy="700" r="5" fill="#40f59c"/>
          <path d="M1095 739 H1082 V758 H1095"/>
          <path d="M1155 739 H1168 V758 H1155"/>
          <circle cx="1113" cy="744" r="3" fill="#40f59c"/>
          <circle cx="1138" cy="744" r="3" fill="#40f59c"/>
          <path d="M1115 760 C1123 766 1133 766 1140 760"/>
          <line x1="1107" y1="780" x2="1143" y2="780"/>
          <line x1="1125" y1="770" x2="1125" y2="789"/>
        </g>
        <text id="bot-label" class="feature" x="1202" y="734" fill="#ffffff">
          <tspan x="1202" dy="0">Бот по подготовке</tspan>
          <tspan x="1202" dy="40">к сессии</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
